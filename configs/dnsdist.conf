-- Backend: Unbound
newServer({address="127.0.0.1:5335", name="unbound"})

-- Plain DNS for local testing
setLocal("127.0.0.1:53")

-- DNS over TLS on port 853
addTLSLocal("127.0.0.1:853", "/etc/dnsdist/certs/cert.pem", "/etc/dnsdist/certs/key.pem")

-- Allow local clients only
setACL({"127.0.0.0/8"})-- dnsdist configuration file, an example can be found in /usr/share/doc/dnsdist/examples/

-- disable security status polling via DNS
setSecurityPollSuffix("")

addDOHLocal("127.0.0.1:443", "/etc/dnsdist/certs/cert.pem", "/etc/dnsdist/certs/key.pem", "/dns-query")
-- Query logging to CSV (one line per answered query)
local logfile = io.open("/var/log/dnsdist/queries.csv", "a")
logfile:setvbuf("line")

function logResponse(dr)
  logfile:write(string.format("%d,%s,%s,%d,%d\n",
    os.time(),
    dr.remoteaddr:toString(),
    dr.qname:toString(),
    dr.qtype,
    dr.rcode))
  return DNSResponseAction.None, ""
end

addResponseAction(AllRule(), LuaResponseAction(logResponse))
