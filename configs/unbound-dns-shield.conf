server:
    interface: 127.0.0.1
    port: 5335
    access-control: 127.0.0.0/8 allow
    hide-identity: yes
    hide-version: yes
    qname-minimisation: yes
    harden-dnssec-stripped: yes
    use-caps-for-id: yes
    prefetch: yes

    do-ip6: no
    edns-buffer-size: 1232
    tcp-upstream: yes
